# The only place dependency versions live. Build scripts refer to these aliases.
[versions]
pekko = "2.0.0"
pekko-http = "2.0.1"
scala213 = "2.13.18"
scala3 = "3.10.1"
kotlin = "2.4.21"
clojure = "1.12.7"
config = "1.4.10"
jackson = "2.23.0"
h2 = "2.5.252"
postgresql = "42.7.15"
spring-boot = "4.2.0"
logback = "1.6.8"
junit = "6.1.3"

[libraries]
pekko-actor-typed = { module = "org.apache.pekko:pekko-actor-typed_2.13", version.ref = "pekko" }
pekko-cluster-typed = { module = "org.apache.pekko:pekko-cluster-typed_2.13", version.ref = "pekko" }
pekko-cluster-sharding-typed = { module = "org.apache.pekko:pekko-cluster-sharding-typed_2.13", version.ref = "pekko" }
pekko-serialization-jackson = { module = "org.apache.pekko:pekko-serialization-jackson_2.13", version.ref = "pekko" }
pekko-http = { module = "org.apache.pekko:pekko-http_2.13", version.ref = "pekko-http" }
pekko-stream = { module = "org.apache.pekko:pekko-stream_2.13", version.ref = "pekko" }
pekko-slf4j = { module = "org.apache.pekko:pekko-slf4j_2.13", version.ref = "pekko" }
scala-library = { module = "org.scala-lang:scala-library", version.ref = "scala213" }
scala3-library = { module = "org.scala-lang:scala3-library_3", version.ref = "scala3" }
clojure = { module = "org.clojure:clojure", version.ref = "clojure" }
typesafe-config = { module = "com.typesafe:config", version.ref = "config" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-module-scala3 = { module = "com.fasterxml.jackson.module:jackson-module-scala_3", version.ref = "jackson" }
jackson-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8", version.ref = "jackson" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-webflux = { module = "org.springframework:spring-webflux" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
