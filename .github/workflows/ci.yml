# Build and test everything on every push and pull request: the JVM modules (with the JDBC
# store's contract run against a real PostgreSQL as well as H2), the Rust CLI, and the docs site.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  jvm:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # StoreContractTest runs against this database too.
      STRATA_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/postgres
      STRATA_TEST_POSTGRES_USER: postgres
      STRATA_TEST_POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # Build and test on Java 21, the lowest version Strata supports (gradle.properties: strata.java.release).
      - run: ./gradlew build -Pstrata.java.toolchain=21 --no-daemon
      - name: PostgreSQL contract ran (not skipped)
        run: |
          skipped=$(grep -c '<skipped' strata-store-jdbc/build/test-results/test/TEST-io.strata.store.jdbc.StoreContractTest.xml || true)
          test "$skipped" = "0" || { echo "StoreContractTest skipped $skipped PostgreSQL runs"; exit 1; }
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the CLI (its --help feeds the CLI reference)
        run: cargo build --locked
        working-directory: cli
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build && node scripts/check-links.mjs
        working-directory: site
