# Publish a release: the libraries and BOM to Maven Central, the Gradle plugin to the Gradle Plugin
# Portal. Runs when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0), or by hand
# from the Actions tab, where "dry run" (the default) builds, signs and checks everything but
# uploads nothing.
#
# Organization secrets it needs (Settings → Secrets and variables → Actions):
#   CENTRAL_TOKEN_USERNAME, CENTRAL_TOKEN_PASSWORD  a user token from central.sonatype.com (Account → Generate user token)
#   STRATA_SIGNING_KEY, STRATA_SIGNING_PASSWORD     an ASCII-armoured private key (gpg --armor --export-secret-keys) and its passphrase
#   GRADLE_PUBLISH_KEY, GRADLE_PUBLISH_SECRET       API keys from plugins.gradle.org (your profile → API Keys)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.1.0"
        required: true
      dry-run:
        description: "Build, sign and check, but upload nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
      STRATA_SIGNING_KEY: ${{ secrets.STRATA_SIGNING_KEY }}
      STRATA_SIGNING_PASSWORD: ${{ secrets.STRATA_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Version
        run: |
          v="${VERSION#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Not a release version: $v"; exit 1; }
          [[ "$v" != *SNAPSHOT* ]] || { echo "Snapshots aren't released"; exit 1; }
          echo "V=$v" >> "$GITHUB_ENV"
          [ -n "$STRATA_SIGNING_KEY" ] || { echo "STRATA_SIGNING_KEY isn't set: releases must be signed"; exit 1; }

      # Everything is built and tested at the released version before anything is uploaded.
      - name: Build and test
        run: ./gradlew build -Pstrata.version="$V" -Pstrata.java.toolchain=21 --no-daemon

      - name: Stage, signed
        run: ./gradlew publishAllPublicationsToStagingRepository -Pstrata.version="$V" -Pstrata.java.toolchain=21 --no-daemon

      - name: Check against Maven Central's rules
        run: python3 scripts/check-release.py build/staging "$V" --signed

      - name: Bundle
        run: |
          cd build/staging
          zip -qr "$GITHUB_WORKSPACE/strata-$V.zip" . -x '*maven-metadata*'
          unzip -l "$GITHUB_WORKSPACE/strata-$V.zip" | tail -1

      - uses: actions/upload-artifact@v7
        with:
          name: strata-${{ env.V }}-bundle
          path: strata-${{ env.V }}.zip

      # Central validates the bundle, then publishes it (publishingType=AUTOMATIC). The Gradle plugin
      # goes out only once the libraries it adds to builds are published.
      - name: Upload to Maven Central
        if: env.DRY_RUN != 'true'
        env:
          USER: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          PASS: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          auth=$(printf '%s:%s' "$USER" "$PASS" | base64 -w0)
          id=$(curl -sSf -X POST -H "Authorization: Bearer $auth" \
                 -F "bundle=@strata-$V.zip" \
                 "https://central.sonatype.com/api/v1/publisher/upload?name=strata-$V&publishingType=AUTOMATIC")
          echo "Deployment $id"
          for i in $(seq 1 90); do
            state=$(curl -sSf -X POST -H "Authorization: Bearer $auth" \
                      "https://central.sonatype.com/api/v1/publisher/status?id=$id" | jq -r .deploymentState)
            echo "$state"
            case "$state" in
              PUBLISHED) exit 0 ;;
              FAILED) curl -sSf -X POST -H "Authorization: Bearer $auth" "https://central.sonatype.com/api/v1/publisher/status?id=$id" | jq .; exit 1 ;;
            esac
            sleep 20
          done
          echo "Still $state after 30 minutes: check central.sonatype.com → Deployments"; exit 1

      - name: Publish the Gradle plugin
        if: env.DRY_RUN != 'true'
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew :strata-gradle-plugin:publishPlugins -Pstrata.version="$V" -Pstrata.java.toolchain=21 --no-daemon
