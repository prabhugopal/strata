# strata-http: serves entity routes with Pekko HTTP. Shared route settings (enabled, base-path,
# max-body-bytes) are in strata-core's reference.conf under strata.http.
strata.http {
  # Address and port to listen on.
  host = "0.0.0.0"
  host = ${?STRATA_HTTP_HOST}
  port = 8080
  port = ${?PORT}
  port = ${?STRATA_HTTP_PORT}
  # How long to wait for the port at start, and for in-flight requests at shutdown.
  bind-timeout = 10s
  shutdown-timeout = 10s
  # How long to wait for a request body to arrive.
  body-timeout = 5s
}
