# Build settings, read by every module. Nothing else names a Java version.
# The Java version Strata targets: language level, APIs and bytecode.
strata.java.release = 21
# The installed JDK that compiles and runs the tests (must be >= release). Use 25 if you have it.
strata.java.toolchain = 27
# The Gradle plugin runs inside users' builds, so it targets the oldest JVM Gradle supports.
strata.gradle-plugin.java.release = 17
# Maven coordinates. Maven Central accepts only a group you can prove you own: a GitHub
# organization owns io.github.<name>. (Java packages stay io.strata.)
strata.group = io.github.strata-jvm
strata.plugin.id = io.github.strata-jvm.strata
# What every published module's POM says about the project (Maven Central requires these).
strata.pom.url = https://github.com/strata-jvm/strata
strata.pom.scm = scm:git:https://github.com/strata-jvm/strata.git
strata.pom.license = Apache-2.0
strata.pom.license.url = https://www.apache.org/licenses/LICENSE-2.0.txt
strata.pom.developer = strata-jvm
strata.pom.developer.name = Strata JVM
strata.pom.developer.url = https://github.com/strata-jvm
strata.version = 0.1.0-SNAPSHOT
org.gradle.caching = true
org.gradle.parallel = true
kotlin.code.style = official
# JVM flags every Strata process needs (tests, examples, production via JAVA_TOOL_OPTIONS).
# Pekko's network layer (Artery, through Agrona) uses JDK-internal APIs that newer JDKs lock down.
strata.jvm.args = --add-exports=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
