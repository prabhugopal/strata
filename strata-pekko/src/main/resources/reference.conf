# Used when strata.runtime.backend = "pekko".
strata.pekko {
  # How the node finds its cluster:
  #   single     - this node forms a cluster of its own (development, single instance)
  #   seed-nodes - join the nodes in strata.pekko.system.pekko.cluster.seed-nodes
  cluster-mode = "single"
  cluster-mode = ${?STRATA_CLUSTER_MODE}
  # With cluster-mode = seed-nodes: the seed node addresses, comma-separated, e.g.
  # "pekko://strata@app-0.app-cluster:25520,pekko://strata@app-1.app-cluster:25520". Empty keeps
  # strata.pekko.system.pekko.cluster.seed-nodes as configured.
  seed-nodes = ""
  seed-nodes = ${?STRATA_SEED_NODES}
  # How long start() waits for this node to become a cluster member.
  startup-timeout = 30s
  # How often start() checks whether the node has joined.
  startup-poll-interval = 20ms
  # Which side of a partitioned cluster keeps running (Pekko's split-brain resolver).
  split-brain {
    # keep-majority  - the side with more nodes (default; an even split stops both sides)
    # lease-majority - the side holding a lease in Strata's store; the side that can't reach the
    #                  store couldn't commit anyway. Recommended for 2 nodes or even sizes.
    # keep-oldest, static-quorum - see Pekko's documentation (set its settings under strata.pekko.system)
    strategy = "keep-majority"
    strategy = ${?STRATA_SPLIT_BRAIN}
    # How long the cluster must be stable (no members joining, leaving or unreachable) before deciding.
    stable-after = 20s
    lease {
      # A held lease is renewed this often, for this long; a node that goes silent loses it after heartbeat-timeout.
      heartbeat-interval = 12s
      heartbeat-timeout = 120s
      operation-timeout = 5s
      # The minority side waits this long before trying for the lease, so the majority gets it first.
      acquire-delay-for-minority = 2s
    }
  }

  # Encryption between nodes (Pekko Artery over TLS), with mutual authentication: a node joins
  # only if it presents a certificate the others trust.
  tls {
    # off      - plain TCP (development)
    # keystore - JKS or PKCS12 key and trust stores (the settings below)
    # pem      - PEM files in a directory, as cert-manager and other secret managers write them:
    #            tls.key (RSA, PKCS#1 or unencrypted PKCS#8), tls.crt, ca.crt. Reread as they
    #            rotate; all nodes' certificates must share a subject name (CN or SAN).
    mode = "off"
    mode = ${?STRATA_TLS}
    keystore {
      key-store = ""
      key-store = ${?STRATA_TLS_KEY_STORE}
      key-store-password = ""
      key-store-password = ${?STRATA_TLS_KEY_STORE_PASSWORD}
      # The key's own password; empty means the key store's.
      key-password = ""
      key-password = ${?STRATA_TLS_KEY_PASSWORD}
      trust-store = ""
      trust-store = ${?STRATA_TLS_TRUST_STORE}
      trust-store-password = ""
      trust-store-password = ${?STRATA_TLS_TRUST_STORE_PASSWORD}
    }
    pem {
      directory = "/var/run/secrets/strata-tls"
      directory = ${?STRATA_TLS_DIR}
      # How long a loaded certificate is used before the files are read again.
      reload-after = 5m
    }
    protocol = "TLSv1.3"
  }

  # Commands that arrive while an entity loads or commits wait in a buffer of this size.
  stash-capacity = 1000
  # Fixed for the cluster's lifetime: shards are the unit of placement and hand-over.
  number-of-shards = 1024

  # Configuration for Strata's actor system. These keys take precedence over plain pekko.*
  # settings, so Strata's required defaults always apply; override them here.
  system {
    name = "strata"
    name = ${?STRATA_SYSTEM_NAME}
    pekko {
      loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
      logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
      actor {
        provider = cluster
        serialization-bindings { "io.strata.pekko.Protocol$Remote" = jackson-cbor }
      }
      remote.artery.canonical {
        # The address other nodes reach this one at (in Kubernetes, the pod's DNS name).
        hostname = "127.0.0.1"
        hostname = ${?STRATA_HOST}
        port = 25520
        port = ${?STRATA_PORT}
      }
      # The interface to listen on; empty means the canonical hostname. Containers use 0.0.0.0.
      remote.artery.bind.hostname = ""
      remote.artery.bind.hostname = ${?STRATA_BIND_HOST}
      cluster {
        downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
        sharding.number-of-shards = ${strata.pekko.number-of-shards}
      }
      # Strata owns the process lifecycle (or Spring does); Pekko must not exit the JVM.
      coordinated-shutdown.exit-jvm = off
    }
  }
}
