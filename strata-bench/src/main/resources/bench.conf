# Benchmark settings; override with -Pbench.<key>=… (Gradle) or -Dbench.<key>=….
bench {
  # memory | jdbc (H2 file in build/bench)
  store = "memory"
  # Callers sending commands concurrently, each waiting for its reply before the next.
  concurrency = 64
  # Distinct entities the callers spread over.
  entities = 1000
  warmup = 5s
  duration = 15s
  # Report percentiles from this many latency samples at most.
  max-samples = 2000000
}
