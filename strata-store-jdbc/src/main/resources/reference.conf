# Used when strata.store.kind = "jdbc".
strata.store.jdbc {
  # Defaults to a local H2 file so development needs no database server. In production
  # point it at PostgreSQL, e.g. jdbc:postgresql://db:5432/strata (set STRATA_JDBC_URL).
  url = "jdbc:h2:file:./data/strata"
  url = ${?STRATA_JDBC_URL}
  user = "sa"
  user = ${?STRATA_JDBC_USER}
  password = ""
  password = ${?STRATA_JDBC_PASSWORD}
  # Table holding one row per entity: (entity_type, entity_id, revision, state, updated_at).
  table = "strata_entity_state"
  # Unfinished invocations' service-call results, and outcomes kept for idempotency keys.
  journal-table = "strata_journal"
  results-table = "strata_results"
  timers-table = "strata_timers"
  leases-table = "strata_leases"
  # Create the tables on start if they don't exist. Turn off when migrations own the schema.
  create-schema = true
  # Largest state, in bytes, the created column holds on databases that need a size (H2).
  # PostgreSQL uses BYTEA, which has no fixed limit.
  max-state-bytes = 1048576
  # Seconds a single statement may take before it's cancelled.
  statement-timeout = 10s

  # Connection pool (HikariCP). Entities commit concurrently, so this bounds database load.
  pool {
    max-size = 16
    max-size = ${?STRATA_JDBC_POOL_SIZE}
    min-idle = 2
    # At start, keep trying to reach the database this long (e.g. while it starts next to the app).
    initialization-timeout = 60s
    # How long a commit waits for a free connection before failing.
    connection-timeout = 5s
    idle-timeout = 10m
    max-lifetime = 30m
  }
}
