# The shop's own settings (read by its services) and Strata's.
shop {
  # How long a placed order waits for payment before it expires and its stock is released.
  payment-window = 15m
  payment-window = ${?SHOP_PAYMENT_WINDOW}
  # Prices in cents.
  prices { tea = 450, mug = 1200, honey = 800 }
}

strata.store.kind = "jdbc"
strata.store.kind = ${?STRATA_STORE}
strata.store.jdbc.url = "jdbc:h2:file:./data/shop"
strata.store.jdbc.url = ${?STRATA_JDBC_URL}
