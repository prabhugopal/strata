# Strata defaults. Override any key in application.conf, with -Dstrata.<key>=..., or with
# the environment variables noted below. Nothing in Strata's code repeats these values.
strata {
  runtime {
    # Which runtime implementation to start (see RuntimeProvider). "pekko" is the native one.
    backend = "pekko"
    backend = ${?STRATA_BACKEND}
  }

  # Strata.run / StrataMain stop the node gracefully when the process is told to stop.
  shutdown-hook = true

  # How long a caller waits for an entity to answer a command.
  call-timeout = 10s

  entity {
    # ephemeral | persistent. Persistent entities commit state before replying.
    default-durability = "persistent"
    # Unload entities idle this long from memory; their state is in the store and the next request
    # loads them again. The only idle setting: Pekko's own idle passivation is switched off.
    passivate-after = 2m
    passivate-after = ${?STRATA_PASSIVATE_AFTER}
    # Longest entity id accepted (characters). Stores size their id columns from this.
    max-id-length = 1024
    # Register every entity type found on the classpath at start (classes annotated @Entity,
    # through the provider strata-processor generates). Off: register types yourself.
    discover = true
    # Entity classes to register at start, by name: @Entity classes compiled without
    # strata-processor (e.g. Scala) are built by reflection; EntityTypeProvider classes are created.
    classes = []
  }

  store {
    # Which StateStore to use (see StateStoreProvider): "memory" or "jdbc".
    kind = "memory"
    kind = ${?STRATA_STORE}
    # Executor for blocking store I/O: "virtual" (one virtual thread per task) or "fixed".
    executor = "virtual"
    # Thread count when executor = "fixed".
    fixed-threads = 16
  }

  # Services entities @Inject, beyond those passed to Strata.start / Strata.run (which win).
  services {
    # Create every @Provides class on the classpath (listed by strata-processor).
    discover = true
    # More service classes to create, by name (e.g. Scala classes compiled without the processor).
    classes = []
  }

  # Durable invocations: commands of entities that use services run off the entity's thread,
  # and each service call's outcome is stored before the code continues, so a command resumes
  # after a crash without repeating an effect. Idempotency keys answer repeated requests.
  durability {
    # Keep the outcome of a request with an idempotency key this long.
    result-retention = 24h
    # Longest idempotency key accepted (characters).
    max-key-length = 256
    # A command interrupted by a crash is resumed by the code running then. If that code no longer
    # makes the recorded calls (it changed in between):
    #   stall   - keep the record and leave the entity unavailable until you roll back or abandon it
    #   abandon - drop the record (effects already made stay made) and let the entity continue
    on-divergence = "stall"
  }

  # Durable timers (Entities.schedule, generated clients' later(…)/at(…)). Every node polls for
  # due timers of the types it runs, claims them, and delivers each with an idempotency key, so a
  # timer fires once even if its node dies mid-delivery (the claim expires and another node retries).
  timers {
    enabled = true
    poll-interval = 1s
    batch = 100
    # How long a claim lasts: a node that dies holding one releases it after this.
    claim-for = 30s
  }

  # The seal: entity code (classes annotated @Entity, and your classes they use) may only reach
  # the outside world through injected services (@Inject) and Strata's API, so every effect can be
  # recorded and replayed. Checked once per type at registration by reading its bytecode.
  # Patterns: "pkg.Class", "pkg.*" (classes in pkg), "pkg.**" (and subpackages), optionally
  # "#member" with * as a wildcard. deny wins over allow. Extend with: allow += "com.acme.money.**"
  seal {
    # enforce (refuse to register), warn (log and register) or off.
    mode = "enforce"
    mode = ${?STRATA_SEAL}
    allow = [
      "java.lang.*", "java.lang.runtime.*",
      "java.lang.invoke.LambdaMetafactory", "java.lang.invoke.StringConcatFactory", "java.lang.invoke.SerializedLambda",
      "java.util.*", "java.util.function.*", "java.util.stream.*", "java.util.regex.*",
      "java.time.**", "java.math.*", "java.text.*",
      "kotlin.**", "scala.**",
      "io.strata.annotation.**", "io.strata.Ctx", "io.strata.Entities", "io.strata.EntityRef", "io.strata.TypeRef", "io.strata.Await",
      "io.strata.StrataRuntime#ref", "io.strata.StrataException",
      # Waiting for another entity's answer inside a command (starting background work is denied below).
      "java.util.concurrent.CompletionStage", "java.util.concurrent.CompletableFuture", "java.util.concurrent.CompletionException",
      "java.util.concurrent.ExecutionException"
    ]
    deny = [
      # The clock, randomness and the environment: use ctx (recorded) instead.
      "java.lang.System", "java.lang.Runtime", "java.lang.Math#random", "java.lang.StrictMath#random",
      "java.util.Random", "java.util.SplittableRandom", "java.util.UUID#randomUUID", "java.util.Collections#shuffle",
      "java.util.Date", "java.util.Calendar", "java.util.TimeZone#getDefault", "java.util.Locale#getDefault",
      "java.time.**#now", "java.time.Clock", "java.time.InstantSource", "java.time.ZoneId#systemDefault", "java.time.zone.ZoneRulesProvider",
      # Threads, waiting and shared state between entities.
      "java.lang.Thread", "java.lang.ThreadLocal", "java.lang.InheritableThreadLocal", "java.lang.ScopedValue",
      "java.lang.Object#wait", "java.lang.Object#notify*", "java.util.Timer", "java.util.TimerTask",
      "java.util.stream.**#parallel*", "java.util.Collection#parallelStream", "java.util.Arrays#parallel*",
      "java.util.concurrent.CompletableFuture#*Async", "java.util.concurrent.CompletableFuture#delayedExecutor",
      "java.util.concurrent.CompletableFuture#orTimeout", "java.util.concurrent.CompletableFuture#completeOnTimeout",
      "java.util.concurrent.CompletionStage#*Async",
      # Processes, class loading and reflection (which would reach anything).
      "java.lang.Process*", "java.lang.ClassLoader", "java.lang.Module", "java.lang.ModuleLayer", "java.lang.StackWalker",
      "java.lang.Class#forName", "java.lang.Class#getDeclared*", "java.lang.Class#getMethod*", "java.lang.Class#getField*",
      "java.lang.Class#getConstructor*", "java.lang.Class#newInstance", "java.lang.Class#getResource*", "java.lang.Class#getClassLoader",
      "java.util.ServiceLoader", "java.util.ResourceBundle", "java.util.Scanner", "java.util.Properties#load*", "java.util.Properties#store*",
      # The Kotlin and Scala standard libraries' I/O, randomness, time and concurrency.
      "kotlin.io.**", "kotlin.random.**", "kotlin.system.**", "kotlin.concurrent.**", "kotlin.time.**", "kotlin.coroutines.**",
      "scala.io.**", "scala.sys.**", "scala.concurrent.**", "scala.util.Random*", "scala.Console*",
      "scala.Predef$#print*", "scala.Predef$#readLine", "scala.reflect.**"
    ]
  }

  # HTTP routes of entity types with a mount (@Entity(mount = ...)). Served by whichever HTTP
  # module is on the classpath: strata-http (Pekko HTTP, its own port) or the Spring starter
  # (on Spring's server).
  http {
    enabled = true
    enabled = ${?STRATA_HTTP_ENABLED}
    # Prefix for every route, e.g. "/api". Empty for none.
    base-path = ""
    # Largest request body accepted (bytes).
    max-body-bytes = 1048576
    # Request header carrying an idempotency key (see strata.durability).
    idempotency-header = "Idempotency-Key"
  }

  # The management API, served under base-path by the same HTTP layer as entity routes. Used by
  # the strata CLI and Stratum: cluster, entity types, entities and their state, events, metrics.
  management {
    enabled = true
    enabled = ${?STRATA_MANAGEMENT_ENABLED}
    base-path = "/strata"
    # When set, every management request needs "Authorization: Bearer <token>".
    token = ""
    token = ${?STRATA_MANAGEMENT_TOKEN}
    # Allow running commands through the management API (read-only otherwise).
    allow-invoke = true
    allow-invoke = ${?STRATA_MANAGEMENT_ALLOW_INVOKE}
    list {
      default-limit = 100
      max-limit = 1000
    }
    events {
      # Events kept in memory per node (the oldest are dropped).
      capacity = 10000
      # Record successful queries too (they are frequent and change nothing).
      include-queries = false
      max-per-request = 1000
    }
    # How deep argument and state schemas are described for forms.
    schema-max-depth = 8
  }

  metrics {
    # Histogram buckets for command and commit latency.
    latency-buckets = [1ms, 2ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2500ms, 5s, 10s]
  }

  codec {
    # Ignore fields in stored state or arguments that the current classes don't have.
    fail-on-unknown-properties = false
    # Which fields Jackson stores without getters: any | non-private | protected-and-public |
    # public-only | none | default. "any" lets @Entity classes keep plain (even private) fields.
    field-visibility = "any"
  }
}
