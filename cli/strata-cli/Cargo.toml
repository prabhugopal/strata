[package]
name = "strata-cli"
description = "The strata command: inspect and drive Strata nodes through their management API"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "strata"
path = "src/main.rs"

[dependencies]
strata-client = { path = "../strata-client" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
