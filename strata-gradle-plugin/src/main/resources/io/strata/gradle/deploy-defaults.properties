# Defaults for strata { image { } kubernetes { } }. Every one can be set in the build script.
# {java} is the Java version the app is compiled for (compileJava's release, else its toolchain),
# so the image's JRE can always run the classes.
image.base=eclipse-temurin:{java}-jre
image.tag=dev
image.builder=docker
# How the image reaches the cluster: minikube (minikube image load), kind (kind load docker-image),
# push (docker push to image.name's registry), none (already there).
kubernetes.load=minikube
kubernetes.namespace=default
kubernetes.replicas=3
kubernetes.httpPort=8080
kubernetes.remotingPort=25520
kubernetes.serviceType=ClusterIP
kubernetes.cpu=500m
kubernetes.memory=512Mi
kubernetes.maxRamPercentage=75
kubernetes.terminationGraceSeconds=30
kubernetes.rolloutTimeout=300s
kubernetes.kubectl=kubectl
kubernetes.minikube=minikube
kubernetes.kind=kind
# A PostgreSQL for development, deployed next to the app. Production points
# kubernetes.jdbcUrl at a managed database instead (and sets postgres = false).
kubernetes.postgres=true
kubernetes.postgresImage=postgres:17-alpine
kubernetes.postgresStorage=1Gi
kubernetes.postgresDatabase=strata
kubernetes.postgresUser=strata
# Node-to-node TLS: the Secret with tls.key, tls.crt, ca.crt (e.g. from cert-manager); empty = off.
kubernetes.tlsSecret=
kubernetes.tlsMountPath=/var/run/secrets/strata-tls
